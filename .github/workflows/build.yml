name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libstdc++6 make \
            libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade Cython virtualenv buildozer

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug > buildozer_log.txt 2>&1

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Buildozer-Log
          path: buildozer_log.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InventoryApp-APK
          path: bin/*.apk
